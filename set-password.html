<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Mania – Set Password</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>
  <div class="topbar-theme">
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
  </div>

  <div class="page-center">
    <div class="container">
      <div class="logo">
        <span class="logo-icon">🔐</span>
        <h1>LUDO MANIA</h1>
        <p>Set Your Password</p>
      </div>

      <div class="card">
        <div style="margin-bottom:24px;">
          <h2 style="font-family:var(--font-display);font-size:16px;letter-spacing:3px;color:var(--text-secondary);text-transform:uppercase;font-weight:600;">New Password</h2>
          <p style="color:var(--text-muted);font-size:13px;margin-top:6px;">Choose a memorable password</p>
        </div>

        <div id="strength-bar" style="margin-bottom:20px;display:none;">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <span class="form-label" style="margin:0;">Password Strength</span>
            <span id="strength-label" style="font-size:12px;font-weight:700;"></span>
          </div>
          <div style="height:4px;background:rgba(255,255,255,0.1);border-radius:2px;">
            <div id="strength-fill" style="height:100%;border-radius:2px;transition:all 0.3s;width:0%;"></div>
          </div>
        </div>

        <form id="set-pass-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="new-password">New Password</label>
            <div style="position:relative;">
              <input type="password" id="new-password" class="form-input" placeholder="Minimum 4 characters" autocomplete="new-password" style="padding-right:50px;" oninput="checkStrength(this.value)" required>
              <button type="button" onclick="togglePwd('new-password',this)" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;opacity:0.5;padding:0;">👁</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm Password</label>
            <div style="position:relative;">
              <input type="password" id="confirm-password" class="form-input" placeholder="Type again" autocomplete="new-password" style="padding-right:50px;" oninput="checkMatch()" required>
              <button type="button" onclick="togglePwd('confirm-password',this)" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;opacity:0.5;padding:0;">👁</button>
            </div>
            <p id="match-msg" style="font-size:12px;margin-top:6px;display:none;"></p>
          </div>
          <button type="submit" class="btn btn-primary">✓ Update Password</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    function togglePwd(id, btn) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.textContent = inp.type === 'password' ? '👁' : '🙈';
    }
    function checkStrength(val) {
      const bar = document.getElementById('strength-bar');
      const fill = document.getElementById('strength-fill');
      const label = document.getElementById('strength-label');
      if (!val) { bar.style.display='none'; return; }
      bar.style.display='block';
      let s=0;
      if(val.length>=4) s++;
      if(val.length>=8) s++;
      if(/[A-Z]/.test(val)) s++;
      if(/[0-9]/.test(val)) s++;
      if(/[^A-Za-z0-9]/.test(val)) s++;
      const levels=[
        {pct:'20%',color:'#ff3b6b',text:'Very Weak'},
        {pct:'40%',color:'#ff7a00',text:'Weak'},
        {pct:'60%',color:'#ffd600',text:'Fair'},
        {pct:'80%',color:'#00d46a',text:'Strong'},
        {pct:'100%',color:'#00ff88',text:'Very Strong!'},
      ];
      const lvl=levels[Math.min(s,4)];
      fill.style.width=lvl.pct; fill.style.background=lvl.color;
      label.textContent=lvl.text; label.style.color=lvl.color;
    }
    function checkMatch() {
      const p1=document.getElementById('new-password').value;
      const p2=document.getElementById('confirm-password').value;
      const msg=document.getElementById('match-msg');
      if(!p2){msg.style.display='none';return;}
      msg.style.display='block';
      if(p1===p2){msg.textContent='✓ Passwords match!';msg.style.color='var(--neon-green)';}
      else{msg.textContent='✕ Passwords do not match';msg.style.color='var(--neon-red)';}
    }
    initSetPasswordPage();
  </script>
</body>
</html>
