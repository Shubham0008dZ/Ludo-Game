<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Mania – Register</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>
  <div class="topbar-theme">
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
  </div>

  <div class="page-center">
    <div class="container">
      <div class="logo">
        <span class="logo-icon">🎲</span>
        <h1>LUDO MANIA</h1>
        <p>Multiplayer Board Game</p>
      </div>

      <!-- Register Form -->
      <div class="card" id="register-form-section">
        <div style="margin-bottom:24px;">
          <h2 style="font-family:var(--font-display);font-size:16px;letter-spacing:3px;color:var(--text-secondary);text-transform:uppercase;font-weight:600;">Create Account</h2>
          <p style="color:var(--text-muted);font-size:13px;margin-top:6px;">Register and start playing!</p>
        </div>
        <form id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-name">Your Name</label>
            <input type="text" id="reg-name" class="form-input" placeholder="e.g. John Smith" autocomplete="name" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-input" placeholder="you@email.com" autocomplete="email" required>
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <button type="submit" class="btn btn-primary">🎮 Create Account</button>
          </div>
        </form>
        <div class="divider">OR</div>
        <p class="text-muted text-center">Already have an account? <a href="login.html">Login →</a></p>
      </div>

      <!-- Success -->
      <div class="card hidden" id="register-success-section">
        <div style="text-align:center;padding:16px 0;">
          <div style="font-size:56px;margin-bottom:16px;filter:drop-shadow(0 0 20px rgba(0,255,136,0.4));">📧</div>
          <h2 style="font-family:var(--font-display);font-size:20px;letter-spacing:2px;background:linear-gradient(135deg,#00ff88,#00b4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;">CHECK YOUR EMAIL!</h2>
          <p style="color:var(--text-secondary);font-size:15px;margin-bottom:6px;">Your login credentials have been sent to:</p>
          <p style="color:var(--neon-green);font-weight:700;font-size:15px;margin-bottom:24px;" id="success-email">—</p>
          <div class="alert alert-info" style="text-align:left;margin-bottom:24px;">
            <span>ℹ</span>
            <span>The email contains your <strong>User ID</strong>, <strong>Password</strong>, and a login link. Check your spam folder too!</span>
          </div>
          <a href="login.html" class="btn btn-primary" style="display:inline-flex;width:auto;padding:13px 28px;">🔑 Go to Login</a>
        </div>
      </div>

      <div style="display:flex;justify-content:center;gap:12px;margin-top:24px;opacity:0.4;">
        <div style="width:10px;height:10px;border-radius:50%;background:var(--red-color);box-shadow:0 0 8px var(--red-color);"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:var(--green-color);box-shadow:0 0 8px var(--green-color);"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:var(--blue-color);box-shadow:0 0 8px var(--blue-color);"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:var(--yellow-color);box-shadow:0 0 8px var(--yellow-color);"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:var(--purple-color);box-shadow:0 0 8px var(--purple-color);"></div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>initRegisterPage();</script>
</body>
</html>
